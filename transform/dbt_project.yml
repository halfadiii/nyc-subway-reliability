name: mta_reliability
version: "1.0.0"
config-version: 2

profile: mta_reliability

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  mta_reliability:
    staging:
      # Views: staging only renames and casts, so materialising it would be a
      # second copy of the landing table earning nothing. The one model in the
      # layer overrides this, and says why.
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      # Tables: these are read repeatedly by the analysis and by anything
      # downstream, and they are small enough that a table is free.
      +materialized: table

vars:
  # ---------------------------------------------------------------------
  # The cancellation rule.
  #
  # A trip-stop pair leaves the feed for two different reasons: the train
  # arrived, or the trip was cancelled, re-routed or short-turned. The only
  # thing separating them is whether the prediction was ever about to come
  # true. A row that vanishes while still comfortably in the future was never
  # an arrival.
  #
  # 120 seconds is a judgement call, and it is a threshold, which is the
  # weakest part of this pipeline. It is a variable rather than a literal so
  # that the sensitivity of every downstream number to it can be measured by
  # re-running with a different value, which is exactly what
  # `analysis/sensitivity.py` does.
  # ---------------------------------------------------------------------
  arrival_grace_seconds: 120

  # Gaps outside this range are not headways. Under half a minute is the same
  # train counted twice or two cars of one train; over an hour is a gap across
  # a service change or an outage in our own polling, and averaging across a
  # hole in the observations invents a wait nobody had.
  min_headway_minutes: 0.5
  max_headway_minutes: 60

  # ---------------------------------------------------------------------
  # How far an incremental run steps back from the newest row it holds.
  #
  # The two large models -- staging and the last sighting of every trip-stop
  # pair -- only read what is new. "New" cannot mean "newer than the newest
  # row loaded", because a file can land late. So each run re-reads this many
  # hours of overlap and lets the unique key discard the repeats.
  #
  # Three hours is far longer than anything the poller does on its own: it
  # writes a file within seconds of fetching it. The overlap is there for a
  # backfill or a replay. Anything landing later than this needs
  # `python run.py refresh`, which rebuilds from the raw files.
  # ---------------------------------------------------------------------
  incremental_lookback_hours: 3
