version: 2

sources:
  - name: raw
    description: >-
      The landing zone. One row per predicted stop per snapshot, exactly as the
      poller flattened it: append-only, nothing deduplicated or corrected on the
      way in. A transformation bug downstream is a query to rewrite; an
      observation dropped here is gone.
    tables:
      - name: stop_time_updates
        description: Flattened GTFS-realtime stop-time updates from all eight feeds.
        # DuckDB reads the poller's output straight off the disk. BigQuery
        # ignores this key and resolves the source to the real table that
        # `load/bigquery/load_bq.py` appends to.
        # No `union_by_name`, and that is the whole performance story here.
        #
        # It was set, and it worked on an afternoon of files and died on a
        # night of them: `Out of Memory Error: Allocation failure`, before a
        # single row was read. `union_by_name` exists to reconcile files whose
        # columns differ, and reconciling means opening every one of them to
        # find out what is in it. At 2,400 files that is the query.
        #
        # It was never needed. One writer produces every file, with the fixed
        # column set in `ingest/schema.py`, so there are no schemas to
        # reconcile -- it was doing 2,400 file opens to discover that they are
        # all identical. Without it the same 1.6M rows read in 0.6 seconds, and
        # inference off the first file gets every type right.
        #
        # If the row shape ever does change, the honest fix is a version column
        # and two sources, not a flag that makes every read pay for the
        # possibility.
        meta:
          external_location: >-
            read_json_auto(
              '{{ env_var("MTA_RAW_GLOB", "../data/raw/**/*.ndjson.gz") }}',
              hive_partitioning = 1
            )
        columns:
          - name: feed_id
            description: Which of the eight endpoints this snapshot came from.
          - name: observed_at
            description: >-
              The feed header's own timestamp, in epoch seconds. The event time.
              Every question this warehouse answers is asked in this clock.
          - name: fetched_at
            description: >-
              Our clock, when the bytes landed. Never the event time; kept only
              so the gap between the two can be monitored, because a feed that
              has stopped being refreshed still answers requests.
          - name: trip_id
            description: MTA trip identifier, unique within a service date.
          - name: stop_id
            description: A single platform, e.g. 127N. Not a station.
          - name: predicted_arrival
            description: >-
              What the MTA believed, at observed_at, about when this trip would
              reach this stop. A prediction, never an arrival.
