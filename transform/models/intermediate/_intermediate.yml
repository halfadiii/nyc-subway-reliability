version: 2

models:
  - name: int_inferred_arrivals
    description: >-
      The measurement the project exists for: an arrival reconstructed from the
      absence of a record. Three rules decide whether a disappearance counts;
      they are set out in the model and proved in tests/test_pipeline.py
      against fixtures whose answer is known by construction.
    data_tests:
      - unique_combination:
          columns: [service_date_raw, trip_id, stop_id]
    columns:
      - name: inferred_arrival
        description: The last prediction that existed before the record vanished.
        data_tests: [not_null]
      - name: last_seen_at
        description: The observation that prediction came from.
        data_tests: [not_null]
      - name: lead_seconds
        description: >-
          How far ahead the arrival still was when the record went. Near zero is
          a train pulling in; negative is one already overdue, which still
          arrived. Bounded above by the cancellation rule.
        data_tests:
          - not_null
          - between:
              # Read from the variable rather than typed as 120. The
              # sensitivity sweep varies the threshold, and this failed at 240s
              # with 57 rows -- correctly, in that the data really did exceed
              # the number written here, and uselessly, because the number
              # written here was meant to *be* the threshold. A test that
              # hardcodes the thing it is checking only passes on the default,
              # and the sweep is what found it.
              lower: -86400
              upper: "{{ var('arrival_grace_seconds') }}"
      - name: observations_of_pair
        description: >-
          How many snapshots carried this pair before it went. One is a weaker
          observation than twenty and worth being able to filter on.
        data_tests: [not_null]
